# Les conteneurs et les routeurs Traefik sont nommés d'après le dossier
# d'installation (nom de projet Compose) pour éviter les collisions entre
# plusieurs déploiements. Pour forcer un nom : COMPOSE_PROJECT_NAME dans .env
#
# Base de données : aucune base n'est embarquée. L'application utilise un
# serveur MariaDB/MySQL centralisé, joignable via le réseau Docker externe
# « db_internal » (DB_HOST = nom du conteneur ou alias sur ce réseau).

services:
  app:
    build: .
    # Accès direct réservé à la machine hôte (diagnostic : curl -I http://127.0.0.1:8089) ;
    # le trafic public passe par Traefik via le réseau « proxy ».
    ports:
      - "127.0.0.1:${APP_PORT:-8089}:80"
    volumes:
      - ./storage:/var/www/html/storage
      # Sauvegardes surveillées par la page de diagnostic (facultatif, lecture seule) :
      # - /chemin/vers/sauvegardes:/backups:ro
    # L'image ne contient pas le fichier .env : toutes les variables utiles à
    # Laravel doivent être transmises ici (mêmes noms que dans .env).
    environment:
      - APP_NAME=${APP_NAME:-Portfolio}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - APP_TIMEZONE=${APP_TIMEZONE:-Europe/Paris}
      - APP_LOCALE=${APP_LOCALE:-fr}
      - APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE:-fr}
      - LOG_LEVEL=${LOG_LEVEL:-warning}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:?DB_HOST doit désigner le serveur de base centralisé (réseau db_internal)}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE doit être défini}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME doit être défini}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD doit être défini}
      - DB_WAIT_TIMEOUT=${DB_WAIT_TIMEOUT:-60}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-120}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_SCHEME=${MAIL_SCHEME:-null}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-null}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-null}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Portfolio}
      - MAIL_TIMEOUT=${MAIL_TIMEOUT:-5}
      - CONTACT_RECIPIENT=${CONTACT_RECIPIENT:-}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
      # Sécurité : bannissement des IP (fail2ban) et en-têtes HTTP
      - LOGIN_BAN_ENABLED=${LOGIN_BAN_ENABLED:-true}
      - LOGIN_BAN_MAX_ATTEMPTS=${LOGIN_BAN_MAX_ATTEMPTS:-3}
      - LOGIN_BAN_WINDOW=${LOGIN_BAN_WINDOW:-15}
      - LOGIN_BAN_DURATION=${LOGIN_BAN_DURATION:-45}
      - LOGIN_BAN_ESCALATION=${LOGIN_BAN_ESCALATION:-360,1440,10080}
      - LOGIN_BAN_ESCALATION_DAYS=${LOGIN_BAN_ESCALATION_DAYS:-30}
      - LOGIN_BAN_WHITELIST=${LOGIN_BAN_WHITELIST:-}
      - SECURITY_HEADERS=${SECURITY_HEADERS:-true}
      - STAFF_DEACTIVATION_WARNING_DAYS=${STAFF_DEACTIVATION_WARNING_DAYS:-3}
      - AUTH_ACCOUNT_SETUP_EXPIRE=${AUTH_ACCOUNT_SETUP_EXPIRE:-4320}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      # Machine SSH bac à sable (facultatif, voir sandbox/README.md)
      - SANDBOX_API_URL=${SANDBOX_API_URL:-}
      - SANDBOX_API_TOKEN=${SANDBOX_API_TOKEN:-}
      - SANDBOX_SSH_HOST=${SANDBOX_SSH_HOST:-}
      - SANDBOX_SSH_PORT=${SANDBOX_SSH_PORT:-}
      - SANDBOX_SSH_MANAGER_PORT=${SANDBOX_SSH_MANAGER_PORT:-}
      - SANDBOX_WS_URL=${SANDBOX_WS_URL:-}
      # Sauvegardes surveillées (dossier monté ci-dessus, ex. /backups)
      - BACKUP_PATH=${BACKUP_PATH:-}
      - BACKUP_MAX_AGE_HOURS=${BACKUP_MAX_AGE_HOURS:-26}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_DOMAIN:-app.example.com}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - db_internal
      # Machine SSH : décommentez (ici et plus bas) une fois sandbox/ déployé.
      # - sandbox_control
    restart: unless-stopped

networks:
  proxy:
    external: true
  db_internal:
    external: true
  # sandbox_control:
  #   name: portfolio-sandbox-control
  #   external: true
