services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: portfolio_web
    ports:
      - "${APP_PORT:-8120}:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_NAME=${APP_NAME:-Portfolio}
      - APP_ENV=local
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=true
      - APP_URL=${APP_URL:-http://localhost:8120}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_NAME:-portfolio_db}
      - DB_USERNAME=${DB_USER:-portfolio_user}
      - DB_PASSWORD=${DB_PASS:-portfolio_password}
      - MAIL_MAILER=smtp
      - MAIL_HOST=${SMTP_HOST:-mailpit}
      - MAIL_PORT=${SMTP_PORT:-1025}
      - MAIL_USERNAME=${SMTP_USER}
      - MAIL_PASSWORD=${SMTP_PASS}
      - MAIL_ENCRYPTION=${SMTP_ENCRYPTION:-null}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-portfolio@example.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Portfolio}
      - CONTACT_RECIPIENT=${CONTACT_RECIPIENT:-}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio_network
    restart: unless-stopped

  # Compile les assets (Tailwind, Alpine, Editor.js) en continu dans public/build
  node:
    image: node:22-alpine
    container_name: portfolio_node
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run build -- --watch"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - portfolio_network
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: portfolio_db
    command: --default-time-zone='+01:00'
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ${DB_NAME:-portfolio_db}
      MYSQL_USER: ${DB_USER:-portfolio_user}
      MYSQL_PASSWORD: ${DB_PASS:-portfolio_password}
    ports:
      - "${DB_FORWARD_PORT:-3322}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio_phpmyadmin
    ports:
      - "${PMA_PORT:-8121}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-portfolio_user}
      PMA_PASSWORD: ${DB_PASS:-portfolio_password}
    depends_on:
      - db
    networks:
      - portfolio_network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: portfolio_mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8032}:8025"
      - "${MAILPIT_SMTP_PORT:-1032}:1025"
    networks:
      - portfolio_network
    restart: unless-stopped

networks:
  portfolio_network:
    driver: bridge
